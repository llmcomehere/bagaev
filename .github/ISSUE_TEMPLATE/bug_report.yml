name: Problem report
description: Report a reproducible problem in the language, tools, or documentation.
title: "[Problem]: "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: "Use SECURITY.md for vulnerabilities. Do not include credentials, personal data, private logs, or exploit details."
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behavior
      description: What happened? What contract or example describes the expected result?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give the affected commit, relevant runtime version, and smallest safe synthetic inputs and steps. Report checks actually run and any limits.
    validations:
      required: true
