[package]
name = "bagaev-cranelift-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
cranelift-codegen = { version = "=0.136.2", default-features = false, features = ["std", "x86"] }
cranelift-frontend = { version = "=0.136.2", default-features = false, features = ["std"] }
cranelift-module = { version = "=0.136.2", default-features = false }
cranelift-object = { version = "=0.136.2", default-features = false }
target-lexicon = "=0.13.5"

[profile.dev]
debug = 0
incremental = false
codegen-units = 16
